[project]
name = "shazamio"
version = "0.8.1"
description = "An asynchronous framework for the reverse engineered Shazam API, written in Python with asyncio and aiohttp."
authors = [{ name = "dotX12" }]
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["python", "shazam", "music", "recognize", "api", "async", "asyncio", "aiohttp", "identification"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/shazamio/ShazamIO"
Repository = "https://github.com/shazamio/ShazamIO"

[tool.poetry]
include = [
    "README.md",
    "LICENSE.txt"
]

[tool.poetry.dependencies]
numpy = "^2.2.2"
# Every release below 3.14.3 carries at least one open advisory, request
# smuggling and header injection among them.
# https://github.com/aio-libs/aiohttp/security/advisories
aiohttp = "^3.14.3"
pydub = "^0.25.1"
# `audioop` left the standard library in 3.13, and `pydub` imports it at module
# scope: `import pydub` raises `ModuleNotFoundError: No module named 'pyaudioop'`.
# `pydub` has not released since 2021, so the shim is ours to declare.
# https://docs.python.org/3.13/whatsnew/3.13.html#pep-594-remove-dead-batteries-from-the-standard-library
audioop-lts = { version = "^0.2.2", python = ">=3.13" }
dataclass-factory = "^2.16"
# A caret here excluded 24.x and 25.x, which conflicts with anything else in the
# environment that asks for a current `aiofiles`. Only `aiofiles.open` is used.
aiofiles = ">=23.2.1,<26.0.0"
anyio = "^4.3.0"
aiohttp-retry = "^2.8.3"
pydantic = "^2.9.2"
shazamio-core = "1.1.2"

[tool.poetry.group.dev.dependencies]
black = {version = "^24.2.0", allow-prereleases = true}
pytest = "8.1.2"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-scoped"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]


[tool.black]
line-length = 100
