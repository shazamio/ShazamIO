[project]
name = "shazamio"
version = "0.8.1"
description = "An asynchronous framework for the reverse engineered Shazam API, written in Python with asyncio and aiohttp."
authors = [{ name = "dotX12" }]
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["python", "shazam", "music", "recognize", "api", "async", "asyncio", "aiohttp", "identification"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
# `poetry-core` derived these from `requires-python`; `uv_build` does not, and
#  without them the PyPI page stops listing the supported versions. Keep in step
#  with `requires-python` above.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Floors only, verified by `just test-floor`: each one is the oldest release the
#  suite passes with, and the comment says what breaks one release below it. A
#  library's upper caps conflict with everything else in a consumer's
#  environment, so a cap needs a reason.
dependencies = [
    # Oldest release with CPython 3.10 wheels on every platform; 1.21.2 shipped
    #  them for Linux only.
    "numpy>=1.21.3",
    # Oldest release with CPython 3.10 wheels; 3.7.4.post0 ships none at all.
    "aiohttp>=3.8.0",
    # `AudioSegment.get_array_of_samples`, which the converter feeds to the
    #  signature generator, first appeared in 0.16.0: 0.15.0 fails the suite
    #  with `AttributeError`.
    "pydub>=0.16.0",
    # `audioop` left the standard library in 3.13, and `pydub` imports it at module
    #  scope: `import pydub` raises `ModuleNotFoundError: No module named 'pyaudioop'`.
    #  `pydub` has not released since 2021, so the shim is ours to declare. Every
    #  release passes the suite; 0.2.2 is the only one shipping CPython 3.14 wheels.
    #  https://docs.python.org/3.13/whatsnew/3.13.html#pep-594-remove-dead-batteries-from-the-standard-library
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    # `async with aiofiles.open(...)` needs the async context manager added in
    #  0.3.0: 0.2.1 fails the suite with `AttributeError: __aenter__`.
    "aiofiles>=0.3.0",
    # `RetryOptionsBase` is first exported in 2.3: 2.2 fails at import.
    "aiohttp-retry>=2.3",
    # The suite passes down to 2.0.3, but `Field(union_mode="left_to_right")` on
    #  the artist union is silently ignored before 2.2.0, so the union parses in
    #  smart mode there.
    "pydantic>=2.2.0",
    # The sibling crate is released in lockstep with this package; an exact pin
    #  ships the one pair that was tested together.
    "shazamio-core==1.2.0",
]

[project.urls]
Homepage = "https://github.com/shazamio/ShazamIO"
Repository = "https://github.com/shazamio/ShazamIO"
Issues = "https://github.com/shazamio/ShazamIO/issues"

[dependency-groups]
dev = [
    { include-group = "tests" },
    { include-group = "lint" },
    { include-group = "hooks" },
]
hooks = [
    # 3.1.1 cannot read the pinned hook repos: they declare the `pre-commit`
    #  stage name introduced in 3.2.0, and older versions reject it with
    #  `Expected one of commit, commit-msg, ... but got: 'pre-commit'`.
    "pre-commit>=3.2.0",
]
tests = [
    # The oldest release `pytest-asyncio` below can run on; the suite passes there.
    "pytest>=7.0.0",
    # The session-scoped async fixtures error at teardown on 0.23.2 and hit
    #  `ScopeMismatch` on anything below 0.23.
    "pytest-asyncio>=0.23.3",
]
lint = [
    "ruff>=0.16.5",
]

# Supply-chain safety net: only resolve packages published at least 7 days ago,
#  so a compromised or typo-squatted release has time to be caught and yanked
#  before it lands in our lockfile. This is the canonical cutoff; it is mirrored
#  as `cooldown.default-days` in `.github/dependabot.yml` (Dependabot ignores
#  `exclude-newer`): keep both in sync.
[tool.uv]
exclude-newer = "7 days"

[build-system]
# `uv_build` is pre-1.0, so a minor (`0.13`) is allowed to break the build; the
#  range takes `0.12.x` patches automatically and holds the next series back.
#  Bumping to a new series is fine and routine: raise both bounds, run
#  `uv build`, and check the wheel still looks right. The bounded shape is what
#  uv's own docs prescribe.
#  https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

# The package is a flat `shazamio/` directory, not the `src/` layout the backend
#  expects by default.
#  https://docs.astral.sh/uv/concepts/build-backend/#modules
[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with `ruff format`
    "ISC001",  # Conflicts with `ruff format`
    "D203",    # Conflicts with D211 (no blank line before class docstring)
    "D213",    # Conflicts with D212 (summary on first line)

    # Per-file copyright headers are not this project's convention; the root
    #  `LICENSE` covers everything.
    "CPY001",

    # The tree predates any docstring convention and there are 250 undocumented
    #  public names; writing them is its own effort, and turning this on now
    #  would bury real findings under legacy ones.
    "D1",      # Undocumented public module/class/method/function
    "D205",    # Legacy docstrings have no summary-line structure to enforce
    "D401",    # Same: rewording legacy docstrings is not lint's job

    # `Any` is the honest annotation in all 11 places this fires: the generic
    #  `RingBuffer`, the `**kwargs` both HTTP clients forward to `aiohttp`, the
    #  argument-forwarding deprecation decorator, pydantic's own
    #  `model_post_init(self, _context: Any)` hook, and `validate_json`, which
    #  returns whatever the endpoint sent. The rest of `ANN` is enforced.
    "ANN401",  # `Any` in an argument or return annotation

    # Public exception classes have carried these names since 0.0.x; renaming
    #  them to `*Error` is a breaking change, not a lint fix.
    "N818",

    # The exception classes are plain `Exception` subclasses that take a message
    #  at the raise site; moving every message into a custom class is a redesign
    #  of the (public) exception surface, not a lint fix.
    "TRY003",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at import time, so moving a model import
#  into `if TYPE_CHECKING:` raises `PydanticUndefinedAnnotation` when the model
#  is built.
#  https://docs.astral.sh/ruff/settings/#lint_flake8-type-checking_runtime-evaluated-base-classes
#  `ruff` cannot follow the chain across modules, so the project's own pydantic
#  base needs listing too.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "shazamio.schemas.base.BaseHrefNext",
]

[tool.ruff.lint.per-file-ignores]
"shazamio/user_agent.py" = [
    "E501",    # A data file: one user-agent string per line, many past 100 chars
]
"shazamio/algorithm.py" = [
    "PLR2004", # DSP thresholds (frequency bands, FFT sizes) are readable inline
    "S101",    # An invariant of the reverse-engineered algorithm, same story as
               #  the `signature.py` checksum guards below.
]
"shazamio/signature.py" = [
    "PLR2004", # Same: binary-format offsets and magic numbers of the signature
    "S101",    # The checksum guards predate the lint; replacing `assert` with
               #  raises changes what a corrupted stream throws, a behavior
               #  change owned by the exception-surface work, not by lint.
]
"examples/*" = [
    "T20",     # `print`/`pprint` is what an example is for
    "INP001",  # Standalone scripts, not a package
    "E501",    # Long Shazam URLs in comments
]
"tests/*" = [
    "S101",    # `assert` is how pytest works
    "PLR2004", # Expected values are literal in asserts
    "S311",    # Non-cryptographic randomness is fine in test data
]
