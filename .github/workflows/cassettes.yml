name: cassettes

# The suite replays recorded answers, so it stays green whatever Shazam changes.
#  This re-records every cassette against the real services once a week and fails
#  when a test no longer passes on what they answer today. Nothing is committed:
#  a failure uploads the re-recorded cassettes as the `cassettes` artifact, and
#  the failing test's cassette there is the answer to fix the library against.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rerecord:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One interpreter is enough: what Shazam answers does not depend on it.
      - name: Install uv and just
        uses: ./.github/actions/setup-just
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: just install

      - name: Re-record against the real services
        run: just test-rerecord

      # A failing test still writes its cassette, so the answer that broke it is kept.
      #  https://github.com/kevin1024/vcrpy/blob/7aaaefe14721cdbe8e690350290aa73b3bb4a03e/vcr/cassette.py#L97
      - name: Keep the answers that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassettes
          path: tests/cassettes/
