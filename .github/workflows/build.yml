name: Publish

on:
  release:
    # Not `created`: it never fires for a draft, so a release drafted in the UI
    #  and published later would never reach PyPI.
    #  https://github.com/github/docs/blob/be38ec5d78e24172587e61b3c6ff40ace1865c71/content/actions/reference/workflows-and-actions/events-that-trigger-workflows.md#release
    types: [published]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Build and publish
      run: |
        uv version "$(git describe --tags --abbrev=0)"
        uv build
        uv publish --username ${{ secrets.PYPI_USERNAME }} --password ${{ secrets.PYPI_PASSWORD }}
