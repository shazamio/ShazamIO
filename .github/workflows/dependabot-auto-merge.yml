name: Dependabot auto-merge

# A minor or patch `uv` bump from Dependabot lands by itself once `CI` passes,
#  see the step's conditions below for what stays manual. The `master` ruleset
#  requiring the `CI` check is what holds the merge until then. Without that
#  rule the step fails and nothing merges; with "Allow auto-merge" off in the
#  repository settings it fails on a pull request still waiting for `CI`.
#  https://github.com/github/docs/blob/602021b0ba16b4a90e9c0a962a67ca9744eac82e/content/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions.md?plain=1#L153-L190
on:
  pull_request:
    branches:
      - "master"

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Merge once `CI` passes
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs triggered by Dependabot get a read-only token, and a `permissions` key
    #  is what raises it.
    #  https://docs.github.com/en/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions#changing-github_token-permissions
    permissions:
      contents: write # merge the pull request
      pull-requests: write # merge the pull request
    steps:
      # `update-type` is the highest bump in the pull request, so one major inside
      #  a group keeps the whole group for a person to read.
      #  https://github.com/dependabot/fetch-metadata/blob/25dd0e34f4fe68f24cc83900b1fe3fe149efef98/README.md?plain=1#L66-L67
      - name: Read what the pull request bumps
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # `uv` bumps only. `CI` never builds the devcontainer, and most Actions
      #  bumps edit `.github/workflows/`, which GitHub refuses to merge
      #  for `GITHUB_TOKEN`, since it can never hold the `workflows` permission.
      #  https://github.com/kairos-io/packages/actions/runs/36784840467/job/110123662107
      #
      # A major can break what `CI` never runs: `build.yml` runs on a release
      #  only. `uv-build` is skipped at any level, see `.github/dependabot.yml`.
      #
      # On a pull request GitHub reports as `CLEAN` or `UNSTABLE`, `gh pr merge
      #  --auto` merges at once, since GitHub refuses auto-merge on one that can
      #  be merged now; a rerun after `CI` passed then lands the bump instead of
      #  failing with `Pull request is in unstable status`. While no check is
      #  required every pull request is such, so the step first fails unless
      #  `master` requires `CI`.
      #  https://github.com/cli/cli/blob/ec5b512045db67e5a2a4ff4a1b02660b2fb24390/pkg/cmd/pr/merge/merge.go#L826-L833
      #  https://github.com/github/docs/blob/b1cce113b64ba25d6c42021e91d788c3adbed6bc/data/reusables/pull_requests/auto-merge-requires-branch-protection.md?plain=1#L2
      #
      # `MERGE`, not squash: Dependabot's commit message is already a
      #  Conventional Commit, so it lands as is. A merge through `GITHUB_TOKEN`
      #  starts no `push` run, so `codeql.yml` sees the bump only through its
      #  pull request run and its weekly schedule.
      #  https://github.com/github/docs/blob/ae648a1d328cb15fb173e80984aac748cf4b5af2/data/reusables/actions/actions-do-not-trigger-workflows.md
      - name: Merge now, or once `CI` passes
        if: >-
          steps.metadata.outputs.package-ecosystem == 'uv'
          && !contains(steps.metadata.outputs.dependency-names, 'uv-build')
          && (steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: |
          required=$(gh api "repos/$REPO/rules/branches/$BASE" \
            --jq '.[] | select(.type == "required_status_checks")
              | .parameters.required_status_checks[].context')
          grep -qx CI <<< "$required" \
            || { echo "::error::$BASE does not require the CI check, so the merge would not wait for it"; exit 1; }
          gh pr merge --auto --merge "$PR_URL"
          # Off a terminal `gh` prints nothing on success, so say which path ran.
          gh pr view "$PR_URL" --json state,autoMergeRequest
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
