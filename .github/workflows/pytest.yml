name: test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and just
        uses: ./.github/actions/setup-just
        with:
          python-version: ${{ matrix.python-version }}

      # `FedericoCarboni/setup-ffmpeg` resolves its download by scraping a
      #  third-party readme at run time and failed two runs in one day with
      #  `AssertionError [ERR_ASSERTION]: Failed to read version from readme`.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: just install

      - name: Check the formatting
        run: just lint

      - name: Run tests
        run: just test
