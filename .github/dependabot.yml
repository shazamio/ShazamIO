# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly

 - package-ecosystem: "github-actions"
   # `/` reaches `.github/workflows` and a root `action.yml` only, which left
   #  `setup-uv` in `setup-just` on `v10.0.1` while `build.yml` moved to
   #  `v10.3.0`. Only `directories` takes a glob.
   #  https://github.com/github/docs/blob/602021b0ba16b4a90e9c0a962a67ca9744eac82e/content/code-security/reference/supply-chain-security/dependabot-options-reference.md#L303-L309
   directories:
     - "/"
     - "/.github/actions/*"
   schedule:
     interval: weekly
   # Same 7 days as the `uv` entry below: Dependabot alone waits only 3.
   #  https://github.com/github/docs/blob/602021b0ba16b4a90e9c0a962a67ca9744eac82e/content/code-security/reference/supply-chain-security/dependabot-options-reference.md#L196
   cooldown:
     default-days: 7
   # One pull request a week for every minor and patch bump; a major gets a pull
   #  request of its own, for a person to read. A dependency lands in the first
   #  group it matches, so `codeql-action` stays above `actions`.
   #  https://github.com/github/docs/blob/602021b0ba16b4a90e9c0a962a67ca9744eac82e/content/code-security/reference/supply-chain-security/dependabot-options-reference.md#L326-L339
   groups:
     # Every level: a bump of one sub-action alone fails with `Loaded a
     #  configuration file for version '4.37.9', but running version '4.38.2'`.
     #  https://github.com/github/codeql-action/blob/2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2/src/config-utils.ts#L1428
     codeql-action:
       patterns:
         - "github/codeql-action*"
     actions:
       patterns:
         - "*"
       update-types:
         - minor
         - patch

 - package-ecosystem: "uv"
   directory: "/"
   schedule:
     interval: weekly
   # The floors in `pyproject.toml` are measured, not latest: the default
   #  raised `pytest-recording` to `>=0.14.0` with nothing failing on `0.13.4`.
   #  This moves only the lock while the floor still admits the new release.
   #  https://github.com/github/docs/blob/602021b0ba16b4a90e9c0a962a67ca9744eac82e/content/code-security/reference/supply-chain-security/dependabot-options-reference.md#L974-L992
   #  https://github.com/dependabot/dependabot-core/blob/ecbee00961d6e88d1f9a1bd5b40965acb025fb2d/python/lib/dependabot/python/update_checker/requirements_updater.rb#L150-L159
   versioning-strategy: increase-if-necessary
   # Canonical: `exclude-newer` in `pyproject.toml`, keep both in sync.
   cooldown:
     default-days: 7
   # Canonical: the `shazamio-core` pin in `pyproject.toml`, bumped by hand.
   ignore:
     - dependency-name: "shazamio-core"
   # One pull request a week for every minor and patch bump, as for actions above.
   groups:
     uv:
       patterns:
         - "*"
       # Every `uv_build` bump keeps a pull request of its own: Dependabot reads
       #  `0.12` to `0.13` as a minor, and a new series needs the manual check
       #  in `pyproject.toml`.
       #  https://github.com/github/docs/blob/602021b0ba16b4a90e9c0a962a67ca9744eac82e/content/code-security/reference/supply-chain-security/dependabot-options-reference.md#L115
       exclude-patterns:
         - "uv-build"
       update-types:
         - minor
         - patch
